# GitHub Actions CI/CD Workflow for Angular Project
# This workflow runs tests with coverage checks and deploys to GitHub Pages
name: Angular CI/CD Pipeline

# Trigger the workflow on every push to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Define environment variables
env:
  NODE_VERSION: '18.x'

jobs:
  # Job 1: Test and Coverage Check
  test:
    name: 🧪 Test & Coverage Check
    runs-on: ubuntu-latest
    
    steps:
      # Checkout the source code
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # Setup Node.js environment
      - name: 🔧 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Cache node_modules for faster builds
      - name: 💾 Cache Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Install dependencies
      - name: 📦 Install Dependencies
        run: npm ci

      # Run Jest tests with coverage (must pass with 80% coverage)
      - name: 🧪 Run Tests with Coverage
        run: npm run test:ci
        env:
          CI: true

      # Upload coverage reports
      - name: 📈 Upload Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/

  # Job 2: Build and Deploy (only runs if tests pass)
  deploy:
    name: 🚀 Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: test  # This job depends on the test job passing
    
    # Only deploy on pushes to main branch (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      # Checkout the source code
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # Setup Node.js environment
      - name: 🔧 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Cache node_modules for faster builds
      - name: 💾 Cache Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Install dependencies
      - name: 📦 Install Dependencies
        run: npm ci

      # Build the Angular application for production
      - name: 🏗️ Build Angular App
        run: npm run build -- --configuration production --base-href "/newFortestingcheck3/"

      # Deploy to GitHub Pages using peaceiris action
      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/new-fortestingcheck3
          cname: # Add your custom domain here if you have one

      # Notify deployment success
      - name: ✅ Deployment Complete
        run: |
          echo "🎉 Successfully deployed to GitHub Pages!"
          echo "🌐 Your app is available at: https://aishwaryakulkarni1801.github.io/newFortestingcheck3/"