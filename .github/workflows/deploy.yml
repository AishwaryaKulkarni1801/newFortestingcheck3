name: CI/CD Pipeline - Test Coverage & Deploy to GitHub Pages

# Trigger the workflow on every push to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Define environment variables
env:
  NODE_VERSION: '18'
  COVERAGE_THRESHOLD: 80

jobs:
  # Job 1: Run tests with coverage validation
  test-coverage:
    name: Test Coverage Validation
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      # Step 2: Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      # Step 3: Cache node_modules for faster builds
      - name: Cache Node.js modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
            
      # Step 4: Install dependencies
      - name: Install Dependencies
        run: npm ci
        
      # Step 5: Run Jest tests with coverage
      - name: Run Tests with Coverage
        run: npm run test:ci
        
      # Step 6: Check coverage threshold
      - name: Check Coverage Threshold
        run: |
          # Extract coverage percentage from jest output
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "Current coverage: $COVERAGE%"
          echo "Required coverage: ${{ env.COVERAGE_THRESHOLD }}%"
          
          # Compare coverage with threshold
          if (( $(echo "$COVERAGE < ${{ env.COVERAGE_THRESHOLD }}" | bc -l) )); then
            echo "❌ Coverage ($COVERAGE%) is below the required threshold (${{ env.COVERAGE_THRESHOLD }}%)"
            echo "COVERAGE_CHECK=FAILED" >> $GITHUB_ENV
            exit 1
          else
            echo "✅ Coverage ($COVERAGE%) meets the required threshold (${{ env.COVERAGE_THRESHOLD }}%)"
            echo "COVERAGE_CHECK=PASSED" >> $GITHUB_ENV
          fi
          
      # Step 7: Upload coverage reports (optional, for visibility)
      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage/
          
  # Job 2: Build and Deploy (only runs if tests pass)
  build-and-deploy:
    name: Build and Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: test-coverage  # This job depends on test-coverage job success
    if: success()  # Only run if the previous job succeeded
    
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
      contents: read    # to read the repository contents
      
    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      # Step 1: Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      # Step 2: Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      # Step 3: Cache node_modules for faster builds
      - name: Cache Node.js modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
            
      # Step 4: Install dependencies
      - name: Install Dependencies
        run: npm ci
        
      # Step 5: Build the Angular application for production
      - name: Build Angular App
        run: npm run build -- --configuration production --base-href /newFortestingcheck3/
        
      # Step 6: Setup GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v3
        
      # Step 7: Upload build artifacts to GitHub Pages
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: './dist/new-fortestingcheck3'
          
      # Step 8: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
        
      # Step 9: Print deployment URL
      - name: Print Deployment URL
        run: |
          echo "🚀 Application deployed successfully!"
          echo "📍 URL: ${{ steps.deployment.outputs.page_url }}"
          
  # Job 3: Notification (runs regardless of success/failure)
  notify:
    name: Build Notification
    runs-on: ubuntu-latest
    needs: [test-coverage, build-and-deploy]
    if: always()  # Run this job regardless of success or failure
    
    steps:
      - name: Notify Build Status
        run: |
          if [[ "${{ needs.test-coverage.result }}" == "success" && "${{ needs.build-and-deploy.result }}" == "success" ]]; then
            echo "✅ Build and deployment completed successfully!"
            echo "🔗 Your app is live at: https://aishwaryakulkarni1801.github.io/newFortestingcheck3/"
          elif [[ "${{ needs.test-coverage.result }}" == "failure" ]]; then
            echo "❌ Build failed due to test coverage or test failures"
            echo "📊 Please ensure test coverage is at least ${{ env.COVERAGE_THRESHOLD }}% and all tests pass"
          else
            echo "❌ Build or deployment failed"
            echo "🔍 Check the logs above for more details"
          fi